      age:
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
  httpx.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  request.Apps:
    properties:
      account:
        maxLength: 20
        type: string
      name:
        maxLength: 20
        type: string
    required:
    - account
    - name
    type: object
  response.LockInfo:
    properties:
      acquired:
        type: boolean
    type: object
info:
  contact: {}
paths:
