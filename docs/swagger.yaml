        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.LockInfo'
              type: object
      summary: 获取App信息
      tags:
      - App相关
