# 本地开发依赖：docker compose up -d
# 凭证仅用于本地开发，与 envconfig/dev_config.yaml 对应
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: willshark-root
      MYSQL_DATABASE: willshark
      MYSQL_USER: willshark
      MYSQL_PASSWORD: willshark
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3306:3306"   # 只监听本机，避免把弱口令数据库暴露到局域网
    volumes:
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uwillshark", "-pwillshark"]
      interval: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"   # Redis 无密码，只监听本机
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 30
